schema_version: 0.1.0
scope: hanta_incubator_metadata_only
sources:
  - source_id: genbank_hantavirus_segments
    source_name: GenBank Hantavirus S/M/L segment sequences
    url: https://www.ncbi.nlm.nih.gov/nuccore/
    publisher: NCBI GenBank
    role: segment_genomics
    status: planned_metadata_audit
    required_fields: [accession, segment, virus_species, host_species, country, collection_date, download_date]
    authenticity: Green: real data after accession audit
  - source_id: gbif_rodent_occurrences
    source_name: GBIF rodent occurrence records
    url: https://www.gbif.org/
    publisher: GBIF
    role: host_occurrence_data
    status: planned_metadata_audit
    required_fields: [gbif_download_doi, gbif_id, host_species, event_date, latitude, longitude, coordinate_uncertainty]
    authenticity: Green: real data after GBIF download audit
  - source_id: cdc_hantavirus_cases_us
    source_name: Reported Cases of Hantavirus Disease
    url: https://www.cdc.gov/hantavirus/data-research/cases/index.html
    publisher: Centers for Disease Control and Prevention
    role: surveillance_context
    status: planned_metadata_audit
    required_fields: [url, access_date, state_or_region, reporting_period, syndrome, privacy_limitations]
    authenticity: Green: real data after access-date audit
  - source_id: who_hantavirus_fact_sheet
    source_name: WHO Hantavirus fact sheet
    url: https://www.who.int/news-room/fact-sheets/detail/hantavirus
    publisher: World Health Organization
    role: syndrome_and_transmission_context
    status: planned_metadata_audit
    required_fields: [url, access_date, syndrome_context, transmission_notes]
    authenticity: Green: real data after access-date audit
  - source_id: ecdc_hantavirus_surveillance
    source_name: ECDC Hantavirus surveillance summaries
    url: https://atlas.ecdc.europa.eu/public/index.aspx?Dataset=27&HealthTopic=24
    publisher: European Centre for Disease Prevention and Control
    role: europe_surveillance_context
    status: public_csv_export_captured_terms_incomplete
    required_fields: [source_url, export_endpoint, HealthTopic, Population, Indicator, Unit, Time, RegionCode, RegionName, NumValue, TxtValue]
    authenticity: Green for public no-credential export capture; retain terms/license follow-up before downstream join clearance
  - source_id: china_hfrs_official_notifiable_bulletins
    source_name: China official HFRS notifiable disease monthly or annual bulletins
    url: https://www.nhc.gov.cn/
    publisher: National Health Commission of the People's Republic of China or China CDC official channels
    role: china_hfrs_longitudinal_context
    status: public_route_reviewed_not_yet_verified_downloadable_table
    required_fields: [citation_or_url, access_date, geography_scope, reporting_period, syndrome, case_count, table_or_bulletin_id, license_or_terms]
    authenticity: Pending official downloadable or parseable table capture with provenance and terms
  - source_id: worldclim_climate_covariates
    source_name: WorldClim climate covariates
    url: https://www.worldclim.org/
    publisher: WorldClim
    role: climate_covariates
    status: public_worldclim_archives_downloaded_file_qc_passed
    required_fields: [version, variable, resolution, crs, download_date]
    authenticity: Green: real data after version audit
  - source_id: esa_worldcover_land_cover
    source_name: ESA WorldCover land cover
    url: https://esa-worldcover.s3.eu-central-1.amazonaws.com/
    publisher: ESA WorldCover
    role: land_cover_covariates
    status: public_tile_bucket_verified_self_service_not_downloaded
    required_fields: [version, variable, resolution, crs, license_or_terms, download_date]
    authenticity: Green for public self-service bucket route; download remains optional until extent-approved tile selection
  - source_id: copernicus_dem_glo30
    source_name: Copernicus DEM GLO-30
    url: https://dataspace.copernicus.eu/explore-data/data-collections/copernicus-contributing-missions/collections-description/COP-DEM
    publisher: Copernicus Data Space Ecosystem
    role: terrain_covariates
    status: public_collection_verified_practical_tile_endpoint_pending_capture
    required_fields: [version, resolution, horizontal_crs, vertical_datum, license_or_terms, download_route]
    authenticity: Green for public collection description; leave repo download pending exact self-service tile endpoint capture
  - source_id: natural_earth_land
    source_name: Natural Earth land polygons
    url: https://naturalearth.s3.amazonaws.com/10m_physical/ne_10m_land.zip
    publisher: Natural Earth
    role: boundary_support_covariates
    status: public_zip_downloaded_file_qc_passed
    required_fields: [version, layer_name, scale, crs, license_or_terms, download_date]
    authenticity: Green: public-domain static support layer downloaded from official public bucket
  - source_id: worldpop_population_surface
    source_name: WorldPop population surfaces
    url: https://hub.worldpop.org/rest/data
    publisher: WorldPop
    role: human_exposure_covariates
    status: public_rest_catalog_verified_product_selection_pending
    required_fields: [product_alias, year, resolution, crs, license_or_terms, download_endpoint]
    authenticity: Green for public REST catalog; product-specific intake remains pending endpoint/license capture
  - source_id: modis_ndvi_covariates
    source_name: MODIS NDVI covariates
    url: https://modis.gsfc.nasa.gov/
    publisher: NASA MODIS
    role: vegetation_covariates
    status: planned_metadata_audit
    required_fields: [product, temporal_aggregation, resolution, download_date]
    authenticity: Green: real data after product audit
